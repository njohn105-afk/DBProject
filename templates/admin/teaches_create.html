<!DOCTYPE html>
<html>
<head>
    <title>Create Assignment</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>Create New Assignment</h1>
    <form method="POST">
        <label>Course:</label>
        <select name="course_id" required>
            <option value="" disabled selected>Select course</option>
            {% for c in courses %}
            <option value="{{ c.course_id }}">{{ c.course_id }} - {{ c.title }}</option>
            {% endfor %}
        </select><br>

        <label>Section:</label>
        <input type="text" name="sec_id" required><br>

        <label>Semester:</label>
        <input type="text" name="semester" required><br>

        <label>Year:</label>
        <input type="number" name="year" required><br>

        <label>Instructor:</label>
        <select name="ID" required>
            <option value="" disabled selected>Select instructor</option>
            {% for i in instructors %}
            <option value="{{ i.ID }}">{{ i.name }} ({{ i.dept_name }})</option>
            {% endfor %}
        </select><br>

        <button type="submit" class="btn btn-green">Create Assignment</button>
    </form>
    <a class="btn" href="/admin/teaches/list">Back to List</a>
</body>
</html>
