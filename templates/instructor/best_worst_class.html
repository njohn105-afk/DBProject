<!DOCTYPE html>
<html>
<head>
    <title>Best & Worst Classes</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>Best & Worst Performing Classes</h1>

    <form method="POST">
        <label>Semester:</label>
        <input type="text" name="semester" required class="form">
        <button type="submit" class="btn btn-green">Get Results</button>
    </form>

    {% if results %}
        <h2>Classes for semester {{ request.form.semester }}</h2>
        <table border="1" cellpadding="5">
            <tr>
                <th>Course ID</th>
                <th>Average Grade</th>
            </tr>
            {% for row in results %}
            <tr>
                <td>{{ row.course_id }}</td>
                <td>{{ "%.2f"|format(row.avg_grade) }}</td>
            </tr>
            {% endfor %}
        </table>
    {% endif %}

    <a href="/instructor-portal" class="btn">Back to Portal</a>
</body>
</html>
