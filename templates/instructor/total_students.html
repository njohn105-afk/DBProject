<!DOCTYPE html>
<html>
<head>
    <title>Total Students by Department</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>Total Number of Students by Department</h1>

    {% if results %}
        <table border="1" cellpadding="5">
            <thead>
                <tr>
                    <th>Department</th>
                    <th>Total Students</th>
                </tr>
            </thead>
            <tbody>
                {% for row in results %}
                <tr>
                    <td>{{ row.dept_name }}</td>
                    <td>{{ row.total_students }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% elif message %}
        <p>{{ message }}</p>
    {% else %}
        <p>No students found in your department.</p>
    {% endif %}

    <p><a href="/instructor-portal" class="btn">Back to Portal</a></p>
</body>
</html>
